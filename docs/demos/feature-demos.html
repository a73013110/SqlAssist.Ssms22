f5edbc;border-top:1px solid #d5ccaa;display:flex;align-items:center;padding:0 12px;font-size:13px;gap:10px}.status .tag{margin-left:auto;color:#625728}.editor{position:absolute;inset:0;padding:25px 24px 0 66px;background:linear-gradient(90deg,#fafafa 0,#fafafa 48px,#e9e9e9 49px,#fff 50px)}.line{position:relative;min-height:31px;white-space:pre;font:22px/31px Consolas,"Courier New",monospace}.line:before{content:attr(data-n);position:absolute;right:calc(100% + 22px);color:#888;font-size:16px}.kw{color:#0000ff}.type{color:#008080}.str{color:#a31515}.comment{color:#008000}.caret{display:inline-block;border-left:2px solid #1b1b1b;height:25px;vertical-align:-5px;margin-right:-2px}.completion{position:absolute;left:296px;top:64px;width:330px;padding:5px;background:#fff;border:1px solid #e5e3de;border-radius:7px;box-shadow:0 3px 10px #0000000c;font-size:17px}.suggest{display:flex;gap:10px;align-items:center;padding:8px 9px;border-radius:4px}.suggest small{margin-left:auto;color:#777;font-size:14px}.suggest.selected{background:#eeede8;border-left:3px solid var(--gold);padding-left:6px}.suggest b{font-weight:700}.suggest-foot{border-top:1px solid var(--line);color:#92928e;padding:7px 10px;display:flex;gap:18px}.preview{position:absolute;left:65px;right:25px;top:194px;bottom:18px;border:1px solid #eceae4;background:var(--paper);box-shadow:0 2px 7px #00000008}.preview-head{padding:13px 17px 9px}.object{font-size:19px;font-weight:600}.meta{color:#72716c;font-size:14px;margin-top:6px}.tabs{display:flex;gap:4px;margin:10px 17px 9px}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:13px;padding:2px 9px;font-size:14px;background:#eeede8;white-space:nowrap}.pill.active{border-color:var(--gold);background:#ebe5d1}.tabs span{padding:4px 12px;border-radius:4px;color:#696963;font-size:15px}.tabs .active{background:white;color:#242424;border:1px solid #ddd;box-shadow:0 1px 3px #00000012}.table{width:100%;border-collapse:collapse;font-size:15px}.table th{text-align:left;font-weight:400;color:#73736d;border-bottom:1px solid #ddd;background:#fff;padding:5px 13px}.table td{padding:5px 13px;height:28px}.table tr:nth-child(odd){background:#f0efed}.table .pill{font-size:11px;padding:0 5px}.preview-code{padding:0 18px;font:18px/26px Consolas,monospace}.key{position:absolute;right:26px;bottom:24px;padding:10px 19px;background:#33352fec;color:white;border:1px solid #222;border-radius:8px;box-shadow:0 3px 8px #0002;font:19px "Segoe UI",sans-serif;z-index:9}.hint{position:absolute;left:177px;top:63px;padding:9px 14px;background:#fffdf5;border:1px solid #d8cfae;box-shadow:0 2px 6px #0001;border-radius:5px;font-size:16px}.browser{position:absolute;inset:0;background:var(--paper);padding:14px 13px}.searchbox{height:40px;display:flex;align-items:center;gap:11px;padding:0 13px;border:1px solid #dfded8;border-radius:6px;background:#fff}.searchbox .mods{margin-left:auto;display:flex;gap:16px;color:#595953;font-size:14px}.filters{display:flex;align-items:center;gap:9px;height:43px;font-size:14px;white-space:nowrap}.divider{height:20px;width:1px;background:var(--line);margin:0 4px}.split{display:grid;grid-template-columns:391px 1fr;gap:13px;height:355px}.results{border-right:5px solid #e8e7e2;padding-right:11px}.card{padding:11px 10px;margin-bottom:7px;border:1px solid #dedcd5;border-radius:5px;background:#fff;font-size:16px}.card.selected{border-color:var(--gold);background:var(--selected)}.row{display:flex;gap:7px;align-items:center;white-space:nowrap}.row .name{overflow:hidden;text-overflow:ellipsis;flex:1}.sub{font-size:13px;color:#676762;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.snippet{font:15px/24px Consolas,monospace;background:#f4f3ef;margin-top:6px;padding-left:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail-title{height:34px;display:flex;align-items:center;gap:9px;font-size:16px;white-space:nowrap}.detail-tools{height:33px;display:flex;align-items:center;gap:15px;font-size:14px;padding-left:3px}.codebox{border:1px solid #e1dfd9;border-radius:5px;background:#fff;padding:14px 13px;height:281px;overflow:hidden}.codebox .line{font-size:18px;line-height:28px;min-height:28px}.codebox .line:before{display:none}.mark{background:#c5b98e;color:#241f12;font-weight:600}.mark.current{background:#68521b;color:#fff;font-weight:700;outline:1px solid #68521b}.footnote{font-size:13px;color:#706849;margin-top:9px}.memorytabs{display:flex;gap:4px;margin-bottom:12px;background:#eeede8;width:max-content;border-radius:5px;padding:3px}.memorytabs span{padding:5px 13px;border:1px solid transparent;border-radius:4px;display:flex;align-items:center;gap:6px;font-size:16px}.memorytabs .active{background:#fff;border-color:#ddd}.memory .split{height:303px}.memory .codebox{height:231px}.memory .card{padding:9px 10px}.memory .detail-title{font-size:15px}.memory .filters{height:42px}.empty{color:#777;text-align:center;font-size:15px;margin-top:90px}.scrim{position:absolute;inset:0;background:#0002;display:grid;place-items:center;z-index:6}.dialog{width:650px;background:var(--paper);border:1px solid #a99c70;box-shadow:0 10px 35px #0003;border-radius:6px;overflow:hidden;font-size:16px}.dialog-title{background:#eee3b8;padding:10px 17px;font-size:17px}.dialog-body{padding:15px 22px}.field{display:flex;gap:10px;align-items:center;margin-bottom:10px}.field label{width:72px}.field .input{background:#fff;border:1px solid #ccc;border-radius:4px;padding:6px 9px;flex:1}.dialog .codebox{height:99px;padding:8px 12px}.dialog .codebox .line{font-size:17px;line-height:25px;min-height:25px}.dialog-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.dialog-foot span{padding:6px 22px;border:1px solid #c8c4b5;border-radius:4px;background:#fff}.dialog-foot .save{background:#e8e0c3;border-color:var(--gold)}#pointer{position:absolute;width:27px;height:32px;z-index:12;pointer-events:none;filter:drop-shadow(1px 2px 1px #0004)}#pointer svg{width:27px;height:32px;fill:#fff;stroke:#292929;stroke-width:1.4}.ripple{position:absolute;z-index:11;width:40px;height:40px;border:3px solid #9c772e;border-radius:50%;background:#d5b85425;transform:translate(-18px,-18px)}.controls{display:flex;gap:10px;align-items:center;margin-top:15px}.controls a{color:#65511f}.controls output{margin-left:auto;font-size:14px;color:#666}.caption{min-height:58px}body.capture{background:#fff}body.capture main{padding:0;margin:0;max-width:none}body.capture main>*:not(.viewport){display:none}body.capture .viewport{border-radius:0;box-shadow:none;width:1100px}
.preview{top:160px;bottom:12px}.preview-head{padding:8px 17px 4px}.preview .meta{font-size:13px;line-height:18px;margin-top:4px}.preview .tabs{margin:6px 17px}.preview .tabs span{padding:3px 10px;font-size:14px}.preview .table td{padding:4px 13px;height:26px}.preview-code .line{font-size:16px;line-height:20px;min-height:20px}.key{top:24px;bottom:auto}
</style>
<main>
<h1>SqlAssist：核心功能操作示意</h1>
<p>依新版 SSMS 22 畫面重建的示意動畫，並非實機錄影。所有內容皆為虛構圖書館資料；操作節奏經過縮短，不代表效能。</p>
<nav id="choices" aria-label="選擇功能"></nav>
<p class="caption" id="caption"></p>
<div class="viewport"><div id="stage" role="img" aria-label="SqlAssist 操作示意"></div></div>
<div class="controls"><button id="play">播放</button><button id="restart">從頭播放</button><a id="still" href="../images/completion-preview-demo.png">查看靜態圖</a><output id="progress"></output></div>
</main>
<script src="feature-demo-data.js"></script>
<script>
const icons={table:'<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',star:'<path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/>',history:'<path d="M4 8a9 9 0 1 1-1 7M3 3v6h6M12 6v6l4 2"/>',copy:'<rect x="8" y="7" width="12" height="14" rx="1"/><path d="M15 7V3H4v14h4"/>',open:'<path d="M9 4H3v17h17v-6M13 3h8v8M10 14 21 3"/>',wrap:'<path d="M3 5h18M3 11h14a4 4 0 0 1 0 8h-5m3-3-3 3 3 3M3 17h4"/>',next:'<path d="M8 4l8 8-8 8"/>',prev:'<path d="m16 4-8 8 8 8"/>',refresh:'<path d="M20 8a9 9 0 1 0 1 7M21 3v6h-6"/>',play:'<path d="m7 3 14 9-14 9z"/>',settings:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>'};
const ico=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.table}</svg>`;
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function sql(s,hit='',current=-1){let index=0;return s.split(/(\b[A-Za-z_][A-Za-z_0-9]*\b|'[^']*'|\b\d+\b)/g).map(t=>{if(hit&&t===hit)return `<span class="mark ${index++===current?'current':''}">${t}</span>`;if(/^(SELECT|FROM|WHERE|AS|CREATE|TABLE|CONSTRAINT|PRIMARY|KEY|NOT|NULL|DEFAULT|ORDER|BY|GO|ASC|DESC)$/.test(t))return `<span class="kw">${t}</span>`;if(/^(int|nvarchar|datetime2|bit)$/.test(t))return `<span class="type">${t}</span>`;if(t.startsWith("'"))return `<span class="str">${esc(t)}</span>`;return esc(t)}).join('')}
const lines=(s,hit='',current=-1)=>{let count=0;return s.split('\n').map((l,i)=>{let c=current-count;count+=(l.match(new RegExp(`\\b${hit||'__none__'}\\b`,'g'))||[]).length;return `<div class="line" data-n="${i+1}">${sql(l,hit,c)}</div>`}).join('')};
const pill=(s,on=false)=>`<span class="pill ${on?'active':''}">${s}</span>`;
const readerSql='SELECT ReaderId, ReaderName\nFROM dbo.Lib_Reader;';
const loanSql='SELECT CopyNo, ReaderId\nFROM dbo.Loan\nORDER BY CopyNo;';
const ddl='CREATE TABLE dbo.Cat_BookCopy\n(\n    CopyNo nvarchar(20) NOT NULL,\n    BranchId int NOT NULL,\n    IsAvailable bit NOT NULL,\n    CONSTRAINT PK_Cat_BookCopy\n        PRIMARY KEY (CopyNo)\n);';
function shell(tab,body,{active='',status='已連線',extra='',pointer=null,click=false,key=''}={}){return `<div class="menubar">${ico('db')}<span>檔案(F)</span><span>編輯(E)</span><span>檢視(V)</span><span>查詢(Q)</span><span>工具(T)</span><span class="app">SQL Server Management Studio 22</span></div><div class="toolbar"><span>新增查詢</span><span class="select">LibraryDB <span style="float:right">⌄</span></span><span style="color:#478042">${ico('play')}</span><span>執行</span><span class="grow"></span>${['History','Favorites','Search'].map((s,i)=>`<span class="tool ${active===s?'on':''}">${ico(['history','star','search'][i])}${s}</span>`).join('')}</div><div class="tabbar">${extra?`<span class="tab off">${extra}</span>`:''}<span class="tab">${tab}<span class="close">×</span></span></div><div class="work">${body}${key?`<div class="key">${key}</div>`:''}</div><div class="status">✓ ${status}<span class="grow"></span><span>LibraryServer</span><span>｜</span><span>LibraryDB</span><span class="tag">操作示意 · 虛構資料</span></div>${pointer?`<div id="pointer" style="left:${pointer[0]}px;top:${pointer[1]}px"><svg viewBox="0 0 27 32"><path d="M3 2v25l6-7 5 10 4-2-5-10h10z"/></svg></div>${click?`<div class="ripple" style="left:${pointer[0]}px;top:${pointer[1]}px"></div>`:''}`:''}`}
const readerRows=[['ReaderId','int','PK · NOT NULL','讀者編號'],['ReaderName','nvarchar(80)','NOT NULL','讀者姓名'],['CardNo','nvarchar(20)','NOT NULL','借閱證號'],['BranchId','int','NOT NULL','所屬分館'],['CreatedAt','datetime2','NOT NULL','建檔時間']];
function structure(script=false){return `<div class="preview"><div class="preview-head"><div class="object">${ico('table')} [dbo].[Lib_Reader]<span style="float:right;color:#777;font-size:13px;font-weight:400">複製選取　　複製全部</span></div><div class="meta">Table　5 個欄位　 PK：ReaderId ASC　1 個索引</div><div class="meta">圖書館讀者基本資料</div></div><div class="tabs"><span class="${script?'':'active'}">欄位</span><span>索引</span><span class="${script?'active':''}">指令碼</span></div>${script?`<div class="preview-code">${lines('CREATE TABLE dbo.Lib_Reader\n(\n    ReaderId int NOT NULL PRIMARY KEY,\n    ReaderName nvarchar(80) NOT NULL,\n    CardNo nvarchar(20) NOT NULL,\n    BranchId int NOT NULL,\n    CreatedAt datetime2 NOT NULL\n);')}</div>`:`<table class="table"><thead><tr><th>#</th><th>欄位</th><th>型別</th><th>旗標</th><th>說明</th></tr></thead><tbody>${readerRows.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td><td>${pill(r[2])}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table>`}</div>`}
function completion(s){let body=`<div class="editor"><div class="line" data-n="1">${sql('SELECT * FROM dbo.'+(s.commit?'Lib_Reader':s.typed||''))}<span class="caret"></span></div></div>`;if(s.typed&&!s.commit){body+=`<div class="completion"><div class="suggest selected">${ico('table')}<span><b>Lib</b>_<b>R</b>eader</span><small>Table · dbo</small></div>${s.typed==='l'?`<div class="suggest">${ico('table')}Lib_Tag<small>Table · dbo</small></div><div class="suggest">${ico('table')}Loan<small>Table · dbo</small></div>`:''}<div class="suggest-foot">${ico('table')}${ico('db')} ···</div></div>`}if(s.preview)body+=structure(s.script);return shell('Lib_Reader.sql',body,{key:s.key,pointer:s.pointer,click:s.click})}
function expansion(s){const expanded='SELECT ReaderId,\n       ReaderName,\n       CardNo,\n       BranchId,\n       CreatedAt\nFROM dbo.Lib_Reader;';let body=`<div class="editor">${s.expanded?lines(expanded):`<div class="line" data-n="1"><span class="kw">SELECT</span> *<span class="caret"></span></div><div class="line" data-n="2"><span class="kw">FROM</span> dbo.Lib_Reader;</div>`}</div>`;if(s.hint&&!s.expanded)body+='<div class="hint">按 Tab 展開所有欄位</div>';return shell('Lib_Reader.sql',body,{key:s.key})}
function search(s){if(!s.open)return shell('Cat_BookCopy.sql',`<div class="editor">${lines('SELECT *\nFROM dbo.Cat_BookCopy;')}</div>`,s);let body=`<div class="browser"><div class="searchbox">${ico('search')}<span>${esc(s.typed||'')}${s.typing?'<span class="caret"></span>':''}</span><span class="mods">Ab　a̲b̲　×　${ico('refresh')}</span></div><div class="filters">${ico('db')} 伺服器: 查詢視窗 (LibraryServer) <span>›</span><span class="divider"></span>${ico('db')} 資料庫: LibraryDB <span>›</span><span class="divider"></span>種類: 全部 <span>›</span>${pill('名稱')}${pill('內容')}${pill('欄位')}</div>`;if(s.results){body+=`<div class="split"><div class="results">${['Cat_BookCopy','Loan','LoanDetail'].map((n,i)=>`<div class="card ${i===0?'selected':''}"><div class="row"><span class="name">[dbo].[${n}]</span>${pill('Table')}${pill('欄位')}</div><div class="sub">LibraryDB.dbo.${n}</div><div class="sub"><span class="mark">CopyNo</span></div></div>`).join('')}<div class="footnote">已顯示全部 3 項</div></div><div><div class="detail-title">⌄ 預覽　[dbo].[Cat_BookCopy] ${pill('Table')}${pill('欄位')}</div><div class="detail-tools">${ico('prev')}<span>${s.next?'2':'1'} / 2</span>${ico('next')}<span class="divider"></span>${ico('copy')}${ico('wrap')}</div><div class="codebox">${lines(ddl,'CopyNo',s.next?1:0)}</div></div></div>`}else body+='<div class="empty">輸入關鍵字，搜尋物件名稱、內容與欄位</div>';return shell('SQL Search',body+'</div>',{...s,active:'Search'})}
function memory(s){if(!s.open||s.query)return shell(s.query?'Loan.sql':'Lib_Reader.sql',`<div class="editor">${lines(s.query?loanSql:readerSql)}</div>`,{...s,extra:s.query?'SQL Memory':'',status:'已連線'});const favorite=s.favorites;let rows=favorite?[['借閱清單','收藏',loanSql]]:s.filtered?[['Loan.sql','執行',loanSql],['LoanDetail.sql','草稿','SELECT * FROM dbo.LoanDetail;']]:[['Lib_Reader.sql','草稿',readerSql],['Loan.sql','執行',loanSql],['LoanDetail.sql','草稿','SELECT * FROM dbo.LoanDetail;']];let body=`<div class="browser memory"><div class="memorytabs"><span class="${favorite?'':'active'}">${ico('history')} History</span><span class="${favorite?'active':''}">${ico('star')} Favorites</span><span>◉ Usage</span></div><div style="position:absolute;right:18px;top:22px;font-size:14px">${ico('settings')} 設定</div><div class="searchbox">${ico('search')}${esc(s.typed||'')}<span class="mods">×　${ico('db')}　${ico('refresh')}</span></div><div class="filters">${favorite?'':`${pill('全部',true)}${pill('執行')}${pill('草稿')}${pill('今天')}${pill('7 天',true)}${pill('30 天')}<span class="divider"></span>`}${ico('db')} 伺服器: 全部　›　${ico('db')} 資料庫: 全部　›</div><div class="split"><div class="results">${rows.map(([name,state,code],i)=>`<div class="card ${i===0?'selected':''}"><div class="row"><span class="name">${name}</span>${pill(state)}${pill('LibraryDB')}</div><div class="snippet">${esc(code.replaceAll('\n',' '))}</div></div>`).join('')}<div class="footnote" style="text-align:center">已顯示全部 ${rows.length} 筆</div></div><div><div class="detail-title">⌄ 預覽　${rows[0][0]} ${pill(rows[0][1])}${pill('LibraryDB')}</div><div class="detail-tools">${ico('copy')}${ico('wrap')}<span class="divider"></span>${ico('open')}<span style="color:#9d7719">${ico('star')}</span></div><div class="codebox">${lines(rows[0][2])}</div></div></div>${s.saved?'<div class="footnote">已新增至收藏：借閱清單</div>':''}</div>`;if(s.dialog){body+=`<div class="scrim"><div class="dialog"><div class="dialog-title">新增至收藏<span class="close">×</span></div><div class="dialog-body"><div class="field"><label>名稱</label><span class="input">${s.named?'借閱清單':'Loan.sql'}</span></div><div class="field"><label>伺服器</label><span class="input">LibraryServer</span><label>資料庫</label><span class="input">LibraryDB</span></div><div class="field"><label>說明</label><span class="input">借閱館藏與讀者編號</span></div><div class="codebox">${lines(loanSql)}</div><div class="dialog-foot"><span class="save">儲存</span><span>取消</span></div></div></div></div>`}return shell('SQL Memory',body,{...s,active:favorite?'Favorites':'History'})}
// 每一格明確指定狀態與停留時間，避免錄製受主機速度與背景計時器影響。
const scene=(duration,state)=>({duration,state});
const demos={

<script src="feature-demo-extra.js"></script>
<script>
window.demoCatalog=Object.fromEntries(Object.entries(demos).map(([id,d])=>[id,{title:d.title,poster:d.poster,frames:d.frames.map(f=>f.duration)}]));
window.renderDemoFrame=(id,index)=>{document.getElementById('stage').innerHTML=demos[id].draw(demos[id].frames[index].state);document.getElementById('stage').setAttribute('aria-label',demos[id].caption);window.afterDemoRender?.()};
let selected='completion-preview',frame=0,playing=false,timer;
function draw(){renderDemoFrame(selected,frame);document.getElementById('progress').textContent=`${frame+1} / ${demos[selected].frames.length}`}
function pause(){playing=false;clearTimeout(timer);document.getElementById('play').textContent='播放'}
function tick(){draw();timer=setTimeout(()=>{frame++;if(frame>=demos[selected].frames.length){frame--;pause();return}tick()},demos[selected].frames[frame].duration)}
function play(){pause();playing=true;document.getElementById('play').textContent='暫停';tick()}
function choose(id,autoplay=true){pause();selected=id;frame=0;document.getElementById('caption').textContent=demos[id].caption;document.getElementById('still').href='../images/'+id+'-demo.png';document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));if(autoplay)play();else draw()}
document.getElementById('choices').innerHTML=Object.entries(demos).map(([id,d])=>`<button data-id="${id}" aria-pressed="false">${d.title}</button>`).join('');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>choose(b.dataset.id));
document.getElementById('play').onclick=()=>{if(playing)pause();else{if(frame===demos[selected].frames.length-1)frame=0;play()}};
document.getElementById('restart').onclick=()=>{frame=0;play()};
const capture=new URLSearchParams(location.search).has('capture');
if(capture)document.body.classList.add('capture');
choose(selected,!capture);
</script>
</html>
