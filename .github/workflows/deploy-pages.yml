name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'README.md'
      - 'README.zh-TW.md'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare VitePress Site Structure
        run: |
          mkdir -p .site/.vitepress/theme
          mkdir -p .site/public

          # 實體複製 docs 與圖片至 site 目錄，杜絕 symlink 相對層級錯誤
          cp -r docs .site/guide
          cp -r docs/images .site/public/images

          # 建立 SEO 爬蟲指引 robots.txt
          cat << 'EOF' > .site/public/robots.txt
          User-agent: *
          Allow: /
          Sitemap: https://a73013110.github.io/SqlAssist.Ssms22/sitemap.xml
          EOF

          # 建立 SSMS 22 科技紫主題樣式
          cat << 'EOF' > .site/.vitepress/theme/style.css
          :root {
            --vp-c-brand-1: #6a35a5;
            --vp-c-brand-2: #8247c9;
            --vp-c-brand-3: #9b5ee0;
            --vp-c-brand-soft: rgba(106, 53, 165, 0.12);
          }
          .dark {
            --vp-c-brand-1: #a060ea;
            --vp-c-brand-2: #8e4ad9;
            --vp-c-brand-3: #6a35a5;
            --vp-c-brand-soft: rgba(160, 96, 234, 0.16);
          }
          .vp-doc img {
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
          }
          EOF

          cat << 'EOF' > .site/.vitepress/theme/index.ts
          import DefaultTheme from 'vitepress/theme'
          import './style.css'

          export default {
            extends: DefaultTheme
          }
          EOF

          # 動態建立 VitePress 設定檔
          cat << 'EOF' > .site/.vitepress/config.mts
          import { defineConfig } from 'vitepress'

          export default defineConfig({
            title: 'SqlAssist for SSMS 22',
            description: '為 SSMS 22.9.x 量身打造的 T-SQL 智慧自動補全與結構預覽擴充套件。',
            base: '/SqlAssist.Ssms22/',
            ignoreDeadLinks: true,
            sitemap: {
              hostname: 'https://a73013110.github.io/SqlAssist.Ssms22'
            },

            head: [
              ['link', { rel: 'icon', href: '/images/logo.png' }],
              ['meta', { name: 'keywords', content: 'SSMS, SQL Server, T-SQL, IntelliSense, Auto-Completion, VSIX, SSMS 22, 結構預覽, 自動補全' }],
              ['meta', { property: 'og:title', content: 'SqlAssist for SSMS 22' }],
              ['meta', { property: 'og:description', content: '為 SSMS 22.9.x 量身打造的 T-SQL 智慧自動補全與結構預覽外掛。純本地執行、毫秒級響應。' }],
              ['meta', { property: 'og:image', content: 'https://a73013110.github.io/SqlAssist.Ssms22/images/hero.png' }],
              ['meta', { name: 'twitter:card', content: 'summary_large_image' }]
            ],

            themeConfig: {
              logo: '/images/logo.png',
              siteTitle: 'SqlAssist',

              nav: [
                { text: '首頁', link: '/' },
                { text: '開始使用', link: '/guide/getting-started' },
                { text: '功能導覽', link: '/#核心功能特色一覽' },
                { text: '文檔索引', link: '/guide/index' },
                { text: '下載 VSIX', link: 'https://github.com/a73013110/SqlAssist.Ssms22/releases' }
              ],

              sidebar: {
                '/guide/': [
                  {
                    text: '🚀 入門與架構',
                    items: [
                      { text: '快速開始', link: '/guide/getting-started' },
                      { text: '核心架構', link: '/guide/architecture' },
                      { text: '設定選項', link: '/guide/settings' },
                      { text: '主題與色彩', link: '/guide/themes' }
                    ]
                  },
                  {
                    text: '💡 智慧自動補全',
                    items: [
                      { text: '自動補全總覽', link: '/guide/completion' },
                      { text: '關鍵字建議', link: '/guide/completion-keywords' },
                      { text: '欄位與別名', link: '/guide/completion-columns' },
                      { text: '變數與暫存表', link: '/guide/completion-variables' },
                      { text: '內建說明與型態', link: '/guide/builtin-help' },
                      { text: '參數資訊提示', link: '/guide/parameter-hint' }
                    ]
                  },
                  {
                    text: '⚡ 展開、片段與編輯',
                    items: [
                      { text: '萬用字元 * 展開', link: '/guide/wildcard-expansion' },
                      { text: 'INSERT / EXEC 語句展開', link: '/guide/statement-expansion' },
                      { text: 'T-SQL 片段導航', link: '/guide/snippets' },
                      { text: '自動配對括號與引號', link: '/guide/auto-pairing' },
                      { text: 'BEGIN/END 區塊配對', link: '/guide/block-matching' }
                    ]
                  },
                  {
                    text: '🔍 預覽、格線與定義',
                    items: [
                      { text: '原地物件結構預覽', link: '/guide/structure-preview' },
                      { text: 'F12 移至定義腳本', link: '/guide/go-to-definition' },
                      { text: '結果格線增強工具', link: '/guide/result-grid' },
                      { text: '格線快速腳本產生', link: '/guide/result-grid-generation' }
                    ]
                  },
                  {
                    text: '🛠️ 開發與維護',
                    items: [
                      { text: '文件路由清單', link: '/guide/index' },
                      { text: '中繼資料分層與快取', link: '/guide/metadata' },
                      { text: '結構健檢分析', link: '/guide/schema-analysis' },
                      { text: '版本發布指引', link: '/guide/release' }
                    ]
                  }
                ]
              },

              outline: {
                level: 'deep',
                label: '本頁目錄'
              },

              docFooter: {
                prev: '上一篇',
                next: '下一篇'
              },

              lastUpdated: {
                text: '最後更新於'
              },

              editLink: {
                pattern: 'https://github.com/a73013110/SqlAssist.Ssms22/edit/master/docs/:path',
                text: '在 GitHub 上編輯此頁'
              },

              socialLinks: [
                { icon: 'github', link: 'https://github.com/a73013110/SqlAssist.Ssms22' }
              ],

              search: {
                provider: 'local',
                options: {
                  locales: {
                    root: {
                      translations: {
                        button: {
                          buttonText: '搜尋文件',
                          buttonAriaLabel: '搜尋文件'
                        },
                        modal: {
                          noResultsText: '找不到相關結果',
                          resetButtonTitle: '清除搜尋條件',
                          footer: {
                            selectText: '選擇',
                            navigateText: '切換',
                            closeText: '關閉'
                          }
                        }
                      }
                    }
                  }
                }
              },

              footer: {
                message: '以 Apache-2.0 授權條款發布 · 專為 SSMS 22 設計',
                copyright: 'Copyright © 2026 SqlAssist.Ssms22'
              }
            }
          })
          EOF

          # 動態建立產品首頁 Landing Page
          cat << 'EOF' > .site/index.md
          ---
          layout: home

          hero:
            name: "SqlAssist for SSMS 22"
            text: "T-SQL 智慧自動補全與結構預覽"
            tagline: "為 SSMS 22.9.x 量身打造。純本地運行、毫秒級響應、無任何雲端或 AI 依賴。"
            image:
              src: /images/hero.png
              alt: SqlAssist for SSMS 22 預覽圖
            actions:
              - theme: brand
                text: 開始使用
                link: /guide/getting-started
              - theme: alt
                text: 下載 VSIX (GitHub)
                link: https://github.com/a73013110/SqlAssist.Ssms22/releases
              - theme: alt
                text: GitHub 原始碼
                link: https://github.com/a73013110/SqlAssist.Ssms22

          features:
            - icon: ⚡
              title: 深度資料庫感知補全
              details: 依 SQL 子句上下文智慧切換建議清單，支援首字母/駝峰縮寫、別名、暫存表、自訂變數與即時欄位型態提示。
            - icon: 📑
              title: Tab 一鍵展開樣板
              details: 萬用字元 * 快速展開為明確欄位；INSERT、EXEC、MERGE、ALTER 自動產生對應結構與具型別的預留值。
            - icon: 🔍
              title: 原地物件結構預覽
              details: 免跳出查詢視窗！原地即時預覽資料表欄位、型別、主鍵、索引及 DDL 定義，支援 F12 快速移至定義。
            - icon: 📊
              title: 結果格線增強工具
              details: 查詢結果直接生成 #temp 建立腳本或 IN 清單、一鍵匯出 Markdown / JSON，並可檢視遭 SSMS 截斷的儲存格內容。
            - icon: 🛡️
              title: 100% 隱私與純本機執行
              details: 純原生 C# / MEF 擴充套件，中繼資料僅向連線的 SQL Server 查詢，無任何外部連線、雲端或 AI 傳輸。
            - icon: 🎨
              title: 完美融入 SSMS 22
              details: 深度整合 SSMS 22 深淺主題、配色快取、自訂字型色彩與多種個人化設定，提供極致流暢的編輯體驗。
          ---

          ## 核心功能特色一覽

          ### 1. 深度上下文自動補全
          依目前輸入的 SQL 子句（SELECT、FROM、WHERE、JOIN、GROUP BY 等）精準過濾關鍵字與資料庫物件，大幅提升編寫 T-SQL 的流暢度。

          <p align="center">
            <img src="/images/completion.png" alt="智慧補全" style="border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); max-width: 100%;">
          </p>

          ### 2. 智慧語法展開（Tab Expand）
          在 `SELECT *` 按下 Tab 即可自動替換為格式化的明確欄位清單。支援 `INSERT INTO`、`EXEC`、`MERGE` 自動填入參數與結構。

          <p align="center">
            <img src="/images/expand-star.png" alt="星號展開" style="border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); max-width: 100%;">
          </p>

          ### 3. 原地結構預覽與 F12 移至定義
          隨時按快捷鍵檢視資料表結構，包括欄位型別、Null 限制、主鍵、外鍵及索引定義，甚至能直接複製 DDL。

          <p align="center">
            <img src="/images/structure-preview.png" alt="結構預覽" style="border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); max-width: 100%;">
          </p>

          ### 4. 實用結果格線右鍵工具
          直接將查詢結果的選取範圍轉為 `#temp` 暫存表建立指令碼、`IN ('a', 'b')` 清單，或匯出為 Markdown 與 JSON 格式。

          <p align="center">
            <img src="/images/result-grid-utility.png" alt="結果格線工具" style="border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); max-width: 100%;">
          </p>
          EOF

      - name: Install VitePress and Build Site
        run: |
          npm install -D vitepress@1.6.4
          npx vitepress build .site

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
